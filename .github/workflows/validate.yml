name: Validate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the aggregate CI result gate
        run: python3 -I -m unittest discover -s scripts -p test_ci_result.py
      - name: Validate plugin manifests and listing metadata
        run: python3 -I scripts/validate_listing.py --self-test
      - name: Build reproducible plugin ZIP
        run: |
          python3 -m unittest discover -s scripts -p test_build_zip.py
          python3 -I scripts/build_zip.py
      - name: Validate the built plugin ZIP
        run: python3 -I scripts/validate_listing.py --zip dist/stella.zip
      - name: Record the plugin ZIP digest
        run: sha256sum dist/stella.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stella-plugin-zip
          path: dist/stella.zip
          if-no-files-found: error
          retention-days: 30

  ci-result:
    if: always()
    needs: [listing]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require every validation job to succeed
        env:
          LISTING_RESULT: ${{ needs.listing.result }}
        run: test "$LISTING_RESULT" = success
