name: Validate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin manifests and listing metadata
        run: python3 -I scripts/validate_listing.py --self-test
      - name: Build reproducible plugin ZIP
        run: |
          python3 -m unittest discover -s scripts -p test_build_zip.py
          python3 -I scripts/build_zip.py
      - name: Validate the built plugin ZIP
        run: python3 -I scripts/validate_listing.py --zip dist/stella.zip

  ci-result:
    if: always()
    needs: [listing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every validation job
        env:
          LISTING_RESULT: ${{ needs.listing.result }}
        run: test "$LISTING_RESULT" = success
